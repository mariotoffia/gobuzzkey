name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag ruleset in RELEASE.md makes tags creation-only. Refuse anything
  # else before any code is checked out.
  tag-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require a protected, non-forced tag creation
        env:
          CREATED: ${{ github.event.created }}
          DELETED: ${{ github.event.deleted }}
          FORCED: ${{ github.event.forced }}
          PROTECTED: ${{ github.ref_protected }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$CREATED" != "true" ] || [ "$DELETED" != "false" ] ||
             [ "$FORCED" != "false" ] || [ "$PROTECTED" != "true" ]; then
            echo "::error::release requires a protected, non-forced tag creation (see RELEASE.md)"
            exit 1
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH"
            exit 1
          fi

  validate:
    needs: tag-policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Tagged commit is on main
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME does not point at a commit on main"; exit 1; }

      - name: Changelog has this version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          grep -Eq "^## \[${TAG#v}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## [${TAG#v}] - YYYY-MM-DD' heading"; exit 1; }

      - name: Install pinned lint tooling
        run: make install

      - name: Gates
        run: make lint test

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Cross-compile archives
        run: make dist VERSION=${{ github.ref_name }}

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          awk -v v="${TAG#v}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > dist/NOTES.md
          test -s dist/NOTES.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: Tag still points at the validated commit
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          remote=$(git ls-remote "https://github.com/$REPO.git" "refs/tags/$TAG^{}" "refs/tags/$TAG" |
            awk 'NR==1 || /\^\{\}$/ { sha=$1 } END { print sha }')
          if [ "$remote" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG moved: origin has $remote, validated $GITHUB_SHA"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$REPO" --verify-tag \
            --title "gobuzzkey $TAG" --notes-file dist/NOTES.md \
            dist/*.tar.gz dist/*.zip dist/checksums.txt
